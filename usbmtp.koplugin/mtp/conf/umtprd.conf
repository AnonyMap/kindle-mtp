# uMTP-Responder config for kindle-mtp (Kindle 10th gen, i.MX6 SoloLite, FW 5.16.x)

# Unplug/replug is handled inside umtprd's event loop either way. 0 means that
# if the loop itself ever gives up, umtprd exits (and the plugin cleans up)
# instead of restarting: a restart closes ep0, which unbinds the configfs
# gadget on Linux 4.1, leaving a daemon that can never reconnect.
loop_on_disconnect 0

# The real user storage (vfat). /mnt/us is Amazon's fuse layer on top of this.
storage "/mnt/base-us" "Kindle" "rw"

# Hide dot-files/folders (Kindle system clutter like .active_content_sandbox).
show_hidden_files 0

# FAT32 has no journal: flush every file to flash as soon as its transfer finishes.
sync_when_close 0x1

# USB buffers. These are umtprd's built-in defaults (8 KiB / 8 KiB / 1 MiB),
# set explicitly. Do NOT use the 0x200 values umtprd's sample config suggests
# for i.MX6: whole MTP datasets must fit in one buffer, so 512 bytes breaks
# listing any file whose name is longer than ~72 characters, and uploads of
# names over ~190 characters desync the session. If the host ever stalls on
# large transfers, try 0x1000 for both (still fits ~900-character names).
usb_max_rd_buffer_size 0x2000
usb_max_wr_buffer_size 0x2000
read_buffer_cache_size 0x100000

manufacturer "KOReader"
product "Kindle (MTP)"
serial "KMTP0001"
firmware_version "usbmtp 0.3"
interface "MTP"
mtp_extensions "microsoft.com: 1.0; android.com: 1.0;"

battery_capacity "/sys/class/power_supply/bd71827_bat/capacity"

# Generic Linux Foundation IDs. Deliberately NOT Amazon's Kindle IDs, so
# Calibre/hosts don't mistake this for the stock USB drive mode.
usb_vendor_id  0x1D6B
usb_product_id 0x0100
usb_class 0x6
usb_subclass 0x1
usb_protocol 0x1
usb_dev_version 0x3008

# FunctionFS endpoints (mounted by mtp-start.sh)
usb_functionfs_mode 0x1
usb_dev_path   "/dev/ffs-mtp/ep0"
usb_epin_path  "/dev/ffs-mtp/ep1"
usb_epout_path "/dev/ffs-mtp/ep2"
usb_epint_path "/dev/ffs-mtp/ep3"
usb_max_packet_size 0x200

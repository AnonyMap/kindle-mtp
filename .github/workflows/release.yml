# Publishes the plugin zip + SHA256SUMS that the plugin's updater downloads.
#
# Works either way you make a release:
#   - push a tag:                 git tag v0.6 && git push origin v0.6
#   - or create the release on GitHub ("Draft a new release", new tag v0.6, Publish)
# If the release already exists, the assets are attached to it (your notes are kept).
# To (re)build assets for an existing tag: Actions > Release > Run workflow > tag.
# The tag must match usbmtp.koplugin/mtp/VERSION at that tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build release assets for (e.g. v0.5)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag name
        run: |
          # Plain numeric versions only (v0.6, v1.2.3): the plugin's updater
          # can't install anything else, e.g. v1.0-rc1.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+(\.[0-9]+)*$'; then
            echo "Not a plain version tag: $TAG"; exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Check tag matches VERSION
        run: |
          v="$(tr -d ' \n' < usbmtp.koplugin/mtp/VERSION)"
          if [ "v$v" != "$TAG" ]; then
            echo "Tag $TAG does not match VERSION $v"; exit 1
          fi

      - name: Install test dependencies
        run: sh .github/actions-test-deps.sh

      - name: Run tests (a release that fails them is never published)
        run: sudo --preserve-env=KOREADER_BASE sh tests/run.sh

      # The suite needs root (mount namespaces). Older tags' tests also wrote
      # into the workspace as root, so make sure the runner user owns it again.
      - name: Give the workspace back to the runner user
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Build assets
        run: sh tools/make-release.sh

      - name: Check the built zip the way the updater will
        run: luajit tests/check_release_zip.lua dist "$KOREADER_BASE"

      - name: Create release, or attach assets to the existing one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; attaching assets"
            gh release upload "$TAG" dist/*.zip dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" dist/*.zip dist/SHA256SUMS \
              --title "$TAG" --generate-notes --verify-tag
          fi

# Runs the whole simulated-Kindle suite (scripts under BusyBox, plugin, updater,
# luacheck) on every push and pull request.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install test dependencies
        run: sh .github/actions-test-deps.sh

      - name: Run tests
        run: sudo --preserve-env=KOREADER_BASE sh tests/run.sh
